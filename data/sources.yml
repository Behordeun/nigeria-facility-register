# Provenance manifest for every external input. The raw files are NOT committed
# (large binaries, and one carries a non-commercial clause); fetch them with
# scripts/fetch_sources.py, which checks each sha256 against the value here.

sources:
  grid3_v2:
    name: GRID3 NGA - Health Facilities v2.0
    url: https://data.humdata.org/dataset/grid3-nga-health-facilities-v2-0
    doi: null
    license: CC BY 4.0
    format: geopackage
    period: 2018 to 2024-10-31
    note: National coverage. Download the .gpkg resource into data/raw/.

  grid3_v3:
    name: GRID3 NGA - Health Facilities v3.0
    url: https://data.humdata.org/dataset/grid3-nga-health-facilities-v3-0
    doi: 10.7916/s6cq-1q98
    license: CC BY 4.0
    format: geopackage
    period: 2018 to 2025-12-31
    note: 24-state coverage, supersedes v2.0 there. Download the .gpkg into data/raw/.

  frame_master_index:
    name: Nigeria 774-LGA master index
    source: geoBoundaries ADM2 + ESPEN IU cartography
    license: CC BY (geoBoundaries); ESPEN cartography factual/geographic
    format: csv
    note: Small derived index, vendored into data/frame/.

  lga_boundaries:
    name: Nigeria 774-LGA boundary polygons (DERIVED, simplified)
    source: geoBoundaries ADM2
    url: https://www.geoboundaries.org
    license: CC BY 4.0
    format: geojson
    note: >
      Vendored into data/frame/nigeria_774_lga_boundaries.simplified.geojson for
      the choropleth. Derived from the geoBoundaries NGA ADM2 boundaries by
      topology-aware simplification (topojson shared-arc, tolerance 0.01), so
      adjacent LGAs keep matching borders with no slivers; keeps only shapeID and
      shapeName; ~1 MB vs ~9 MB raw. MultiPolygons are exploded to one single
      Polygon feature per part (a deck.gl polygon layer rejects MultiPolygons),
      so the file is 800 features over the 774 LGAs, each LGA a distinct shapeID.
      Joins the master index on shapeID, all 774 LGAs present. CC BY 4.0 permits
      redistribution with attribution, so it is
      committed, not fetched. Regenerate with scripts/build_lga_geometry.py
      --source <raw geojson> (needs the dev extra for topojson).

  ntd_sth_state:
    name: ESPEN STH endemicity, per-state summary (DERIVED)
    url: https://espen.afro.who.int/countries/nigeria
    license: CC BY-NC-SA 3.0 IGO (upstream ESPEN)
    format: csv
    note: >
      Non-commercial. Only the DERIVED per-state summary is committed, never the
      raw ESPEN IU table. Attribution required; no commercial redistribution.

  # Enrichment inputs. Each is a small DERIVED per-LGA table built by
  # scripts/build_enrichment_sources.py from a file in the Geospatial monorepo,
  # which is read only and never modified. upstream_sha256 pins the exact
  # monorepo file the committed table was derived from; sha256 pins the
  # committed table itself.

  ntd_espen_lga:
    name: ESPEN NTD endemicity, per LGA and disease (DERIVED)
    url: https://espen.afro.who.int/countries/nigeria
    license: CC BY-NC-SA 3.0 IGO (upstream ESPEN)
    format: csv
    derived_from: Geospatial/espen_ntd/data/espen_long.csv (ESPEN IU-level, 2014-2025)
    upstream_sha256: a438ade2dc971c785416f500961c57aaab892f58b4c89fcb747167b5d0f1e412
    sha256: 4c8c3d9d0d426bb34cb341e07a5306991eb881952e9ffc2629246549f7d02a4a
    note: >
      Non-commercial. Five diseases (STH, schistosomiasis, lymphatic filariasis,
      onchocerciasis, Loa loa), one row per (LGA, disease): the latest year's
      endemicity label and the latest non-"Unknown" label. Trachoma, water and
      sanitation are not in the long table and are not included. Only this
      summary is committed, never the raw ESPEN IU table.

  flood_event_affected_lga:
    name: Flood-event exposure per LGA (DERIVED)
    source: NASA MODIS flood products, summarised per LGA in the flood_health project
    license: NASA open data (no restriction on reuse; attribution requested)
    format: csv
    derived_from: Geospatial/flood_health/data/lga_flood_event_affected.csv
    upstream_sha256: 983221d07644194ad36b0b7195239b3e75d3cbfae4833e13f9c8a43b519bb750
    sha256: 6e216b4360160dd3480b1375f23c90b440899ce1762e59b1a16234bbcffef71d
    note: >
      One row per (LGA, event_year): 2022 at state resolution (the state's flag
      repeated to each LGA), 2024 at LGA resolution. affected is a 0/1 exposure
      flag, not a severity. The single-year flood-days table was not brought in:
      it covers 224 LGAs, keys on a non-unique name, and does not say why the
      rest are absent.

  births_lga:
    name: WorldPop annual births per LGA (DERIVED)
    url: https://www.worldpop.org
    license: CC BY 4.0
    format: csv
    derived_from: Geospatial/sickle_cell/data/lga_births.csv (WorldPop 1 km births, 2015, UN-adjusted)
    upstream_sha256: 39ed0a19636f7b25a35e144c8b3c49b4d90ecc460447d9d2bbced4685422bbef
    sha256: d95c6a9b5a4c7bb340793216be5e44d9c9e3202e3452378e1c674d62700e14c9
    note: >
      Zonal-summed into the 774 geoBoundaries polygons, keyed on shapeID. The
      monorepo's state_population.csv is placeholder projections and is not used.
  access_population_lga:
    name: Per-LGA population and travel time to healthcare (DERIVED)
    license: CC BY 4.0 (WorldPop); CC BY (Malaria Atlas Project)
    format: csv
    built_by: scripts/build_access_population.py
    population_years: 2025-2030 (one row per LGA per year; the dbt build selects the year)
    upstream:
      worldpop:
        name: WorldPop Global2 R2025A constrained population, Nigeria, 100 m, one raster per year
        release: R2025A
        url: https://data.worldpop.org/GIS/Population/Global_2015_2030/R2025A/{year}/NGA/v1/100m/constrained/nga_pop_{year}_CN_100m_R2025A_v1.tif
        doi: 10.5258/SOTON/WP00839
        license: CC BY 4.0
        sha256_by_year:
          2025: abc7e897aff7de024d851a24613eebf28e710dbfe4dea9c3e02ee285d75d4f8b
          2026: faf500222458db1fad3baf5012c70c935ea0e5fedc4c1e78fa8d4565cb0994b0
          2027: 73cf624e00fc9b774dba5d60b76178fe8f4553ffa86ed55591ddfd652a3c9dd7
          2028: bdae1963834aecab778d7c299fefac1e285dfdfac7fb97aabf78857490dbe23d
          2029: 14d46fa1e6ecefee8f85791bd3e85a4b5339abf954c4372b1d5d76e9b6df1d7c
          2030: 50fe68d86a3a40ee3ff956638c50cefab41a1f05071905cb08ae7461e1916f66
      map_motorised:
        name: Malaria Atlas Project motorised travel time to healthcare (2020 release), Nigeria cut-out
        coverage_id: Accessibility__202001_Global_Motorized_Travel_Time_to_Healthcare
        url: https://data.malariaatlas.org/geoserver/Accessibility/wcs (WCS 2.0.1 GetCoverage, box 2.5,4.0,14.9,14.0)
        citation: Weiss et al., Nature Medicine 26, 1835-1838 (2020)
        license: CC BY (MAP catalogue 4.0; MAP open-access policy 3.0)
        sha256: c1553756e14cb2866b42bb2ba6da61ab1f9b6c1f733e64d64b12dda5cec7321c
      map_walking:
        name: Malaria Atlas Project walking-only travel time to healthcare (2020 release), Nigeria cut-out
        coverage_id: Accessibility__202001_Global_Walking_Only_Travel_Time_To_Healthcare
        url: https://data.malariaatlas.org/geoserver/Accessibility/wcs (WCS 2.0.1 GetCoverage, box 2.5,4.0,14.9,14.0)
        citation: Weiss et al., Nature Medicine 26, 1835-1838 (2020)
        license: CC BY (MAP catalogue 4.0; MAP open-access policy 3.0)
        sha256: 4be0f62c28895630d1999ee0582801d75bde9564f2fde5e7f18704b6865a280f
      boundaries:
        name: geoBoundaries Nigeria ADM2, full resolution (774 LGAs)
        derived_from: Geospatial/_shared_frame/nigeria_adm2_lga_boundaries.geojson
        license: CC BY 4.0
        sha256: bef7f2cfa45e012f4772eaa61c7b99e5188aeba4d5c6badae7e9f9aae8c02fcd
    sha256: 782d915132fcaa386095f7da345f82fb385a7040885c5686e0601bff143df73f
    note: >
      Rasters are fetched into data/raw/rasters/ and never committed. The build
      refuses a download whose hash differs from the pins above. Population is
      summed at 100 m; travel times are population-weighted means on the 1 km
      MAP grid. On the 2025 build the LGA totals capture 99.97% of the national
      WorldPop total (the rest falls on border and coastal cells outside the LGA
      polygons). Null travel figures mean no population on valid travel-time
      cells, never 0 minutes.
