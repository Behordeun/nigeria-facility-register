name: ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Sonar needs full history to assign issues to the right commits.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.12"

      # Install from the committed lockfile (frozen) so CI uses the exact pinned,
      # resolved versions (including dbt-duckdb 1.9.6) and transitive
      # dependencies cannot drift between the lock and the run.
      - name: Install
        run: uv sync --frozen --extra dev --extra orchestration

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests
        run: uv run pytest -q

      # Upload coverage to SonarCloud. pytest wrote coverage.xml (see pyproject).
      # Skipped when SONAR_TOKEN is absent (forks, or before the secret is set),
      # so a missing credential does not fail the build. Pinned to a full commit
      # SHA (the v4.2.1 release) so a moved tag cannot swap in unreviewed action
      # code that would run with the token in its environment.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1

      # The committed sample fixture (data/sample/, two states) lets CI run the
      # full transform without the WAF-gated production geopackages. This builds
      # the staging and marts models and runs the dbt tests, so the enforced data
      # contract is proven on every PR, not just parsed.
      - name: Load sample fixture into DuckDB
        run: uv run python -m nfr.load_sources --db build/nfr.duckdb --raw data/sample

      # fixture_build=true enables the fixture-only coverage tests (e.g. that the
      # sample exercises all three lineage statuses). Those tests are disabled by
      # default so a real production refresh, which may legitimately contain only
      # one or two statuses, is never rejected by them.
      - name: dbt build + test on the fixture
        working-directory: dbt
        run: |
          uv run dbt deps
          uv run dbt build --profiles-dir . --vars 'fixture_build: true'
