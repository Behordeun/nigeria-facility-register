name: ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install dbt-duckdb==1.9.6

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      # The committed sample fixture (data/sample/, two states) lets CI run the
      # full transform without the WAF-gated production geopackages. This builds
      # the staging and marts models and runs the dbt tests, so the enforced data
      # contract is proven on every PR, not just parsed.
      - name: Load sample fixture into DuckDB
        run: python -m nfr.load_sources --db build/nfr.duckdb --raw data/sample

      - name: dbt build + test on the fixture
        working-directory: dbt
        run: |
          dbt deps || true
          dbt build --profiles-dir .
