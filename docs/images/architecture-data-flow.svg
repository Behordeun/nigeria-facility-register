<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1540 1030" width="1540" height="1030" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Data flow</title>
  <desc id="d">Sources are fetched or vendored, loaded into an immutable DuckDB raw layer, modelled by dbt into staging models and contracted marts, and served read-only through a Superset dashboard, refreshed by Dagster.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7fa8"/></marker>
    <symbol id="i-pin" viewBox="0 0 32 32"><path fill-rule="evenodd" d="M16 2a10 10 0 0 1 10 10c0 8-10 18-10 18S6 20 6 12A10 10 0 0 1 16 2zm0 6a4 4 0 1 0 0 8a4 4 0 1 0 0-8z" fill="currentColor"/></symbol>
    <symbol id="i-db" viewBox="0 0 32 32"><ellipse cx="16" cy="7" rx="12" ry="5" fill="currentColor"/><path d="M4 7v18a12 5 0 0 0 24 0V7" fill="currentColor"/><path d="M4 13a12 5 0 0 0 24 0M4 19a12 5 0 0 0 24 0" fill="none" stroke="#fff" stroke-width="1.6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 32 32"><path d="M16 3l13 6-13 6L3 9z" fill="currentColor"/><path d="M3 15l13 6 13-6M3 21l13 6 13-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-table" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="3" fill="currentColor"/><path d="M3 12h26M3 20h26M12 4v24M21 4v24" stroke="#fff" stroke-width="1.6"/></symbol>
    <symbol id="i-map" viewBox="0 0 32 32"><path d="M3 7l8-4 10 4 8-4v22l-8 4-10-4-8 4z" fill="currentColor"/><path d="M11 3v22M21 7v22" stroke="#fff" stroke-width="1.6"/></symbol>
    <symbol id="i-virus" viewBox="0 0 32 32"><circle cx="16" cy="16" r="8" fill="currentColor"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 2v5M16 25v5M2 16h5M25 16h5M6 6l3.5 3.5M22.5 22.5L26 26M26 6l-3.5 3.5M9.5 22.5L6 26"/></g><circle cx="13" cy="14" r="1.8" fill="#fff"/><circle cx="18.5" cy="18" r="1.4" fill="#fff"/></symbol>
    <symbol id="i-drop" viewBox="0 0 32 32"><path d="M16 3c5 7 9 11.5 9 16a9 9 0 0 1-18 0c0-4.5 4-9 9-16z" fill="currentColor"/><path d="M12 19a4 4 0 0 0 4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-seed" viewBox="0 0 32 32"><path d="M6 26C6 13 14 6 27 5c0 13-7 21-20 21z" fill="currentColor"/><path d="M6 26C11 19 16 14 22 10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 32 32"><path d="M7 3h13l6 6v20H7z" fill="currentColor"/><path d="M11 15h11M11 20h11M11 25h7" stroke="#fff" stroke-width="1.8"/></symbol>
    <symbol id="i-chart" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M8 22l6-6 4 3 7-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 9v7l5 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 32 32"><rect x="2" y="11" width="16" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><rect x="14" y="11" width="16" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <style>
      .h1{font-size:28px;font-weight:700;fill:#1b2a4a}
      .sub{font-size:14px;fill:#55617a}
      .col{font-size:13px;font-weight:700;letter-spacing:.6px}
      .ct{font-size:14.5px;font-weight:700;fill:#1b2a4a}
      .cb{font-size:12px;fill:#46516a}
      .ft{font-size:11px;font-style:italic;fill:#7a8398}
      .e{fill:none;stroke:#6b7fa8;stroke-width:1.8;marker-end:url(#a)}
      .ed{fill:none;stroke:#9aa6bf;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>

  <rect width="1540" height="1030" fill="#fff"/>
  <text x="40" y="50" class="h1">Data flow</text>
  <text x="40" y="76" class="sub">From public sources to the published register and the dashboard. Solid arrows carry data; dashed means loaded and tested but not yet used.</text>

  <!-- column backgrounds and headers -->
  <rect x="30" y="100" width="210" height="904" rx="14" fill="#eef4fd"/>
  <rect x="258" y="100" width="232" height="904" rx="14" fill="#f2f5f9"/>
  <rect x="508" y="100" width="232" height="904" rx="14" fill="#f2effc"/>
  <rect x="788" y="100" width="242" height="904" rx="14" fill="#ecf8f3"/>
  <rect x="1078" y="100" width="242" height="904" rx="14" fill="#eef4fd"/>
  <rect x="1358" y="100" width="172" height="904" rx="14" fill="#eef8f1"/>
  <text x="135" y="128" class="col" fill="#2f5fb3" text-anchor="middle">SOURCES</text>
  <text x="374" y="128" class="col" fill="#4e5a70" text-anchor="middle">IN THE REPO</text>
  <text x="624" y="128" class="col" fill="#4a35a8" text-anchor="middle">RAW · DUCKDB</text>
  <text x="909" y="128" class="col" fill="#167a5e" text-anchor="middle">STAGING · DBT</text>
  <text x="1199" y="128" class="col" fill="#2f5fb3" text-anchor="middle">MARTS · DBT</text>
  <text x="1444" y="128" class="col" fill="#1a6e3d" text-anchor="middle">SERVING</text>

  <!-- ========== connectors (drawn first, under the cards) ========== -->
  <path class="e" d="M230,200 H518"/>
  <path class="e" d="M730,200 H798"/>
  <path class="e" d="M730,214 H760 V320 H798"/>
  <path class="e" d="M1020,200 H1088"/>
  <path class="e" d="M1020,320 H1088"/>
  <path class="e" d="M480,440 H518"/>
  <path class="e" d="M730,440 H1088"/>
  <path class="e" d="M1062,440 V186 H1088"/>
  <path class="e" d="M1062,334 H1088"/>
  <path class="e" d="M230,560 H268"/>
  <path class="e" d="M480,560 H518"/>
  <path class="e" d="M730,560 H798"/>
  <path class="e" d="M730,680 H770 V574 H798"/>
  <path class="e" d="M1020,560 H1088"/>
  <path class="e" d="M1020,548 H1044 V214 H1088"/>
  <path class="e" d="M230,800 H268"/>
  <path class="e" d="M230,680 H268"/>
  <path class="ed" d="M480,680 H496 V906 H518"/>
  <path class="e" d="M480,800 H1076 V452 H1088"/>
  <path class="e" d="M230,920 H268"/>
  <path class="ed" d="M480,920 H518"/>
  <path class="e" d="M1310,200 H1366"/>
  <path class="e" d="M1310,320 H1366"/>
  <path class="e" d="M1310,440 H1366"/>
  <path class="e" d="M1310,560 H1338 V470 H1366"/>

  <!-- ========== SOURCES ========== -->
  <g>
    <rect x="40" y="152" width="190" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-pin" xlink:href="#i-pin" x="50" y="162" width="26" height="26" color="#2f6fd6"/>
    <text x="84" y="180" class="ct">GRID3 registers</text>
    <text class="cb"><tspan x="52" y="204">v2.0 national, v3.0 24 states</tspan><tspan x="52" y="220">geopackages, CC BY 4.0</tspan></text>
    <text x="52" y="238" class="ft">fetched, never committed</text>
  </g>
  <g>
    <rect x="40" y="512" width="190" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-virus" xlink:href="#i-virus" x="50" y="522" width="26" height="26" color="#c0392b"/>
    <text x="84" y="540" class="ct">ESPEN NTD data</text>
    <text class="cb"><tspan x="52" y="564">IU endemicity, five diseases</tspan><tspan x="52" y="580">CC BY-NC-SA 3.0 IGO</tspan></text>
    <text x="52" y="598" class="ft">non-commercial; derived only</text>
  </g>
  <g>
    <rect x="40" y="752" width="190" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-map" xlink:href="#i-map" x="50" y="762" width="26" height="26" color="#2f6fd6"/>
    <text x="84" y="780" class="ct">geoBoundaries</text>
    <text class="cb"><tspan x="52" y="804">Nigeria ADM2 polygons</tspan><tspan x="52" y="820">CC BY 4.0</tspan></text>
  </g>
  <g>
    <rect x="40" y="872" width="190" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-drop" xlink:href="#i-drop" x="50" y="882" width="26" height="26" color="#2f86c9"/>
    <text x="84" y="900" class="ct">Flood + WorldPop</text>
    <text class="cb"><tspan x="52" y="924">flood-event exposure,</tspan><tspan x="52" y="940">2015 births per LGA</tspan></text>
  </g>

  <g>
    <rect x="40" y="632" width="190" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-pin" xlink:href="#i-pin" x="50" y="642" width="26" height="26" color="#2f6fd6"/>
    <text x="84" y="660" class="ct">MAP + WorldPop</text>
    <text class="cb"><tspan x="52" y="684">travel time to care (2020);</tspan><tspan x="52" y="700">2025 population, 100 m</tspan></text>
    <text x="52" y="718" class="ft">rasters fetched, never committed</text>
  </g>

  <!-- ========== IN THE REPO ========== -->
  <g>
    <rect x="270" y="392" width="210" height="96" rx="10" fill="#fff" stroke="#cfd6e2"/>
    <use href="#i-map" xlink:href="#i-map" x="280" y="402" width="26" height="26" color="#4e5a70"/>
    <text x="314" y="420" class="ct">LGA frame</text>
    <text class="cb"><tspan x="282" y="444">774 LGAs, centroids, shapeID</tspan><tspan x="282" y="460">+ alias crosswalk to canonical</tspan><tspan x="282" y="476">LGA names</tspan></text>
  </g>
  <g>
    <rect x="270" y="512" width="210" height="96" rx="10" fill="#fff" stroke="#cfd6e2"/>
    <use href="#i-doc" xlink:href="#i-doc" x="280" y="522" width="26" height="26" color="#4e5a70"/>
    <text x="314" y="540" class="ct">ESPEN summaries</text>
    <text class="cb"><tspan x="282" y="564">per-state STH high share;</tspan><tspan x="282" y="580">per-LGA status, five diseases</tspan></text>
    <text x="282" y="598" class="ft">derived, non-commercial</text>
  </g>
  <g>
    <rect x="270" y="752" width="210" height="96" rx="10" fill="#fff" stroke="#cfd6e2"/>
    <use href="#i-map" xlink:href="#i-map" x="280" y="762" width="26" height="26" color="#4e5a70"/>
    <text x="314" y="780" class="ct">LGA boundaries</text>
    <text class="cb"><tspan x="282" y="804">774 LGAs, simplified on the</tspan><tspan x="282" y="820">shared topology (~1 MB)</tspan></text>
  </g>
  <g>
    <rect x="270" y="872" width="210" height="96" rx="10" fill="#fff" stroke="#cfd6e2"/>
    <use href="#i-doc" xlink:href="#i-doc" x="280" y="882" width="26" height="26" color="#4e5a70"/>
    <text x="314" y="900" class="ct">Enrichment inputs</text>
    <text class="cb"><tspan x="282" y="924">flood exposure 2022 / 2024,</tspan><tspan x="282" y="940">WorldPop births per LGA</tspan></text>
  </g>

  <g>
    <rect x="270" y="632" width="210" height="96" rx="10" fill="#fff" stroke="#cfd6e2"/>
    <use href="#i-doc" xlink:href="#i-doc" x="280" y="642" width="26" height="26" color="#4e5a70"/>
    <text x="314" y="660" class="ct">Access + population</text>
    <text class="cb"><tspan x="282" y="684">per-LGA population and</tspan><tspan x="282" y="700">population-weighted travel time</tspan></text>
    <text x="282" y="718" class="ft">derived, CC BY</text>
  </g>

  <!-- ========== RAW (DuckDB) ========== -->
  <g>
    <rect x="520" y="152" width="210" height="96" rx="10" fill="#fff" stroke="#cfc6f0"/>
    <use href="#i-db" xlink:href="#i-db" x="530" y="162" width="26" height="26" color="#6a4fd1"/>
    <text x="564" y="180" class="ct">grid3_v2 · grid3_v3</text>
    <text class="cb"><tspan x="532" y="204">facility points as fetched,</tspan><tspan x="532" y="220">from a per-run immutable</tspan><tspan x="532" y="236">snapshot; hashes pinned</tspan></text>
  </g>
  <g>
    <rect x="520" y="392" width="210" height="96" rx="10" fill="#fff" stroke="#cfc6f0"/>
    <use href="#i-db" xlink:href="#i-db" x="530" y="402" width="26" height="26" color="#6a4fd1"/>
    <text x="564" y="420" class="ct">frame_master_index</text>
    <text class="cb"><tspan x="532" y="444">lga_alias_crosswalk</tspan><tspan x="532" y="460">the 774-LGA spine every</tspan><tspan x="532" y="476">table joins to</tspan></text>
  </g>
  <g>
    <rect x="520" y="512" width="210" height="96" rx="10" fill="#fff" stroke="#cfc6f0"/>
    <use href="#i-db" xlink:href="#i-db" x="530" y="522" width="26" height="26" color="#6a4fd1"/>
    <text x="564" y="540" class="ct">ntd_espen_lga</text>
    <text class="cb"><tspan x="532" y="564">ntd_sth_state (feeds the</tspan><tspan x="532" y="580">coverage mart's state STH</tspan><tspan x="532" y="596">column directly)</tspan></text>
  </g>
  <g>
    <rect x="520" y="632" width="210" height="96" rx="10" fill="#fff" stroke="#cfc6f0"/>
    <use href="#i-seed" xlink:href="#i-seed" x="530" y="642" width="26" height="26" color="#2e9d55"/>
    <text x="564" y="660" class="ct">ntd_endemicity_rank</text>
    <text class="cb"><tspan x="532" y="684">dbt seed: every known label</tspan><tspan x="532" y="700">to a 0-3 rank; unknown is</tspan><tspan x="532" y="716">never ranked</tspan></text>
  </g>
  <g>
    <rect x="520" y="872" width="210" height="122" rx="10" fill="#fff" stroke="#cfc6f0" stroke-dasharray="5 4"/>
    <use href="#i-db" xlink:href="#i-db" x="530" y="882" width="26" height="26" color="#9b8fd6"/>
    <text x="564" y="900" class="ct">flood, births, access</text>
    <text class="cb"><tspan x="532" y="924">flood_event_affected_lga,</tspan><tspan x="532" y="940">births_lga,</tspan><tspan x="532" y="956">access_population_lga</tspan></text>
    <text x="532" y="982" class="ft">loaded and tested, not yet joined</text>
  </g>

  <!-- ========== STAGING (dbt) ========== -->
  <g>
    <rect x="800" y="152" width="220" height="96" rx="10" fill="#fff" stroke="#bfe5d8"/>
    <use href="#i-layers" xlink:href="#i-layers" x="810" y="162" width="26" height="26" color="#1f9d7a"/>
    <text x="844" y="180" class="ct">stg_facilities_authority</text>
    <text class="cb"><tspan x="812" y="204">GRID3 v3.0 where it covers a</tspan><tspan x="812" y="220">state, v2.0 elsewhere, never</tspan><tspan x="812" y="236">mixed; one row per facility</tspan></text>
  </g>
  <g>
    <rect x="800" y="272" width="220" height="96" rx="10" fill="#fff" stroke="#bfe5d8"/>
    <use href="#i-link" xlink:href="#i-link" x="810" y="282" width="26" height="26" color="#1f9d7a"/>
    <text x="844" y="300" class="ct">stg_version_lineage</text>
    <text class="cb"><tspan x="812" y="324">v2.0 matched to v3.0 within</tspan><tspan x="812" y="340">100 m: carried over, dropped,</tspan><tspan x="812" y="356">appeared</tspan></text>
  </g>
  <g>
    <rect x="800" y="512" width="220" height="96" rx="10" fill="#fff" stroke="#bfe5d8"/>
    <use href="#i-layers" xlink:href="#i-layers" x="810" y="522" width="26" height="26" color="#1f9d7a"/>
    <text x="844" y="540" class="ct">stg_ntd_endemicity_lga</text>
    <text class="cb"><tspan x="812" y="564">774 LGAs x 5 diseases,</tspan><tspan x="812" y="580">ranked 0-3 by the seed;</tspan><tspan x="812" y="596">unknown stays null, never 0</tspan></text>
  </g>

  <!-- ========== MARTS (dbt) ========== -->
  <g>
    <rect x="1090" y="152" width="220" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-table" xlink:href="#i-table" x="1100" y="162" width="26" height="26" color="#2f6fd6"/>
    <text x="1134" y="180" class="ct">lga_coverage_burden</text>
    <text class="cb"><tspan x="1102" y="204">one row per LGA (774):</tspan><tspan x="1102" y="220">coverage x burden, five</tspan><tspan x="1102" y="236">ranks, priority flag</tspan></text>
  </g>
  <g>
    <rect x="1090" y="272" width="220" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-table" xlink:href="#i-table" x="1100" y="282" width="26" height="26" color="#2f6fd6"/>
    <text x="1134" y="300" class="ct">lga_version_drift</text>
    <text class="cb"><tspan x="1102" y="324">one row per lineage record,</tspan><tspan x="1102" y="340">resolved to the LGA frame</tspan></text>
  </g>
  <g>
    <rect x="1090" y="392" width="220" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-map" xlink:href="#i-map" x="1100" y="402" width="26" height="26" color="#2f6fd6"/>
    <text x="1134" y="420" class="ct" font-size="13.5" textLength="168" lengthAdjust="spacingAndGlyphs">lga_coverage_choropleth</text>
    <text class="cb"><tspan x="1102" y="444">coverage + LGA polygons,</tspan><tspan x="1102" y="460">one row per polygon part</tspan><tspan x="1102" y="476">(800 over 774 LGAs)</tspan></text>
  </g>
  <g>
    <rect x="1090" y="512" width="220" height="96" rx="10" fill="#fff" stroke="#bcd3f2"/>
    <use href="#i-table" xlink:href="#i-table" x="1100" y="522" width="26" height="26" color="#2f6fd6"/>
    <text x="1134" y="540" class="ct">register_summary</text>
    <text class="cb"><tspan x="1102" y="564">one row: build time, register</tspan><tspan x="1102" y="580">versions, totals, known-status</tspan><tspan x="1102" y="596">counts, lineage totals</tspan></text>
  </g>
  <g>
    <rect x="1090" y="632" width="220" height="96" rx="10" fill="#f7faff" stroke="#bcd3f2" stroke-dasharray="4 3"/>
    <use href="#i-doc" xlink:href="#i-doc" x="1100" y="642" width="26" height="26" color="#2f6fd6"/>
    <text x="1134" y="660" class="ct">Data contract</text>
    <text class="cb"><tspan x="1102" y="684">enforced column contracts and</tspan><tspan x="1102" y="700">dbt tests: 774 LGAs, unique</tspan><tspan x="1102" y="716">keys, missing is not zero</tspan></text>
  </g>

  <!-- ========== SERVING ========== -->
  <g>
    <rect x="1368" y="152" width="154" height="336" rx="10" fill="#fff" stroke="#bfe3cc"/>
    <use href="#i-chart" xlink:href="#i-chart" x="1378" y="162" width="26" height="26" color="#1f8a4c"/>
    <text x="1412" y="180" class="ct">Superset</text>
    <text class="cb"><tspan x="1380" y="206">read-only dashboard</tspan><tspan x="1380" y="236" font-weight="700" fill="#1a6e3d">Coverage</tspan><tspan x="1380" y="256" font-weight="700" fill="#1a6e3d">NTD burden</tspan><tspan x="1380" y="276" font-weight="700" fill="#1a6e3d">Version drift</tspan><tspan x="1380" y="296" font-weight="700" fill="#1a6e3d">Data status</tspan><tspan x="1380" y="326">state and status filters,</tspan><tspan x="1380" y="342">LGA hover summaries,</tspan><tspan x="1380" y="358">live status panel</tspan><tspan x="1380" y="388">kept as a committed</tspan><tspan x="1380" y="404">import bundle</tspan></text>
    <text x="1380" y="470" class="ft">make dashboard</text>
  </g>
  <g>
    <rect x="1368" y="632" width="154" height="216" rx="10" fill="#fff8ec" stroke="#f1d7a6"/>
    <use href="#i-clock" xlink:href="#i-clock" x="1378" y="642" width="26" height="26" color="#c77d12"/>
    <text x="1412" y="660" class="ct">Dagster</text>
    <text class="cb"><tspan x="1380" y="686">rebuilds the whole</tspan><tspan x="1380" y="702">register weekly and on</tspan><tspan x="1380" y="718">a new source vintage;</tspan><tspan x="1380" y="748">tests and a quality gate</tspan><tspan x="1380" y="764">run before an atomic</tspan><tspan x="1380" y="780">publish</tspan></text>
    <text x="1380" y="832" class="ft">see Orchestration</text>
  </g>
</svg>
