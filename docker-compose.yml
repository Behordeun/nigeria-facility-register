# Always-on Dagster deployment: the webserver (UI) and the daemon (runs the
# weekly schedule and the new-vintage sensor) are two processes from the one
# image, sharing a DAGSTER_HOME so they see the same instance, run storage and
# schedules. This is a deployment substrate, not the dev/CI loop.
#
# State lives in named volumes and a bind mount:
#   - dagster_home: the instance (run storage, schedule/sensor state, dagster.yaml)
#   - build: the DuckDB database, the run-scoped staging DBs, and the snapshots
#   - data/raw (bind): the license-fetched GRID3 geopackages the operator places
#     with scripts/fetch_sources.py --place; never baked into the image
#
# The two services share DAGSTER_HOME and build/, so the daemon that promotes a
# refresh and the webserver that reports it read the same files. The refresh
# itself stays serialised by the QueuedRunCoordinator in dagster.yaml.

x-dagster-common: &dagster-common
  build:
    context: .
    dockerfile: Dockerfile
  image: nfr-dagster:local
  environment:
    DAGSTER_HOME: /opt/dagster/home
  volumes:
    - dagster_home:/opt/dagster/home
    - build:/app/build
    - ./data/raw:/app/data/raw:ro
  # Seed dagster.yaml into the shared home on first start (empty volume), then
  # run the service's role. The webserver and daemon must agree on the instance,
  # so both run this seed; it is idempotent.
  entrypoint:
    - /bin/sh
    - -c
    - |
      cp -n /app/dagster.yaml "$$DAGSTER_HOME/dagster.yaml" 2>/dev/null || true
      exec "$$@"
    - --

services:
  webserver:
    <<: *dagster-common
    # The process binds 0.0.0.0 INSIDE the container by necessity: Docker's
    # published-port forwarding reaches a container over its bridge interface,
    # not loopback, so a process bound to the container's 127.0.0.1 would be
    # unreachable even through the host mapping. The UI is unauthenticated, so
    # the guard is the host-side publish below plus the internal network:
    #   - the port is published ONLY on the host's 127.0.0.1, so it is not
    #     reachable from other hosts;
    #   - the service sits on an internal bridge network, so another container
    #     on a shared network is the only other thing that could reach it.
    # SECURITY: never drop the "127.0.0.1:" prefix on the ports entry without
    # putting an authenticating reverse proxy in front; that prefix is the only
    # thing keeping the unauthenticated UI off every host interface.
    command:
      - uv
      - run
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -m
      - nfr.orchestration.definitions
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
    depends_on:
      - daemon

  daemon:
    <<: *dagster-common
    command:
      - uv
      - run
      - dagster-daemon
      - run
      - -m
      - nfr.orchestration.definitions
    networks:
      - internal

  # Apache Superset reading the live DuckDB register read-only, for dashboards
  # (the coverage x burden choropleth from lga_coverage_choropleth, and the
  # version-drift breakdown). Built from superset/Dockerfile: the digest-pinned
  # upstream image plus the duckdb:// driver, Playwright with Chromium for
  # server-side dashboard downloads, and superset/superset_config.py. It mounts
  # the same build/ volume as the Dagster services but READ-ONLY, so a dashboard
  # query can never alter the published register.
  superset:
    build:
      context: ./superset
    image: nfr-superset:local
    environment: &superset-environment
      # The secret key and the admin password are required, not defaulted: the
      # :? syntax aborts the up with the given message if the value is unset or
      # empty, so a deployment that forgets the .env cannot boot with a known
      # credential. Copy .env.example to .env and set real values first. The
      # username is not a credential, so it keeps a plain default.
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required; put it in a .env file}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required; put it in a .env file}
      # Mapbox token for the deck.gl basemap. Optional: without it the deck.gl
      # map tiles do not load, but the data layer and every non-map chart work.
      # Public token (pk.), kept in .env, never committed. Default empty so the
      # stack still boots without one.
      MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
    volumes:
      # The live register, read-only: Superset reads it, never writes it.
      - build:/app/register:ro
      - superset_home:/app/superset_home
    # Bootstrap the metadata DB and admin, then start. Idempotent: re-running
    # upgrade/init/create-admin is safe.
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USERNAME}" --firstname Admin --lastname User \
          --email admin@example.com --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
        exec gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'
    ports:
      # Localhost only, same reasoning as the Dagster UI: front with an auth
      # proxy before exposing. Superset has its own login, but keep it off other
      # interfaces by default.
      - "127.0.0.1:8088:8088"
    networks:
      - internal
    depends_on:
      - daemon
      - redis
      - superset-worker

  # Renders dashboard downloads (PDF and image) on the server. The Download menu
  # queues a job; this worker opens the dashboard in headless Chromium as the
  # requesting user, screenshots it and caches the image in Redis for the page
  # to fetch. It shares the metadata DB (superset_home) with the web server so
  # it can sign in as that user, and reaches it over the compose network. It
  # does not mount the register: the web server runs every query.
  superset-worker:
    image: nfr-superset:local
    environment: *superset-environment
    volumes:
      - superset_home:/app/superset_home
    command:
      - celery
      - --app=superset.tasks.celery_app:app
      - worker
      - --pool=prefork
      - --concurrency=1
      - -O
      - fair
    networks:
      - internal
    depends_on:
      - redis

  # Celery broker and the screenshot cache. Not published on any host port.
  redis:
    image: redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275
    networks:
      - internal

networks:
  # A private bridge for every service; nothing outside this compose project is
  # attached, so the only external reach is the host loopback publish on the
  # Dagster and Superset UIs. It is not an `internal: true` network, because the
  # browser and the screenshot worker load Mapbox basemap tiles from the web.
  internal:

volumes:
  dagster_home:
  build:
  superset_home:
