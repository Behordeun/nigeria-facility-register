[project]
name = "nigeria-facility-register"
version = "0.1.0"
description = "Version-aware health-facility register for Nigeria, built from GRID3 releases"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Muhammad Abiodun Sulaiman" },
    { name = "Bolaji Fatai  Oyeyemi" },
    { name = "Hammed Sarafadeen" },
]
dependencies = [
    "duckdb==1.1.3",
    "geopandas==1.1.2",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "pyyaml==6.0.2",
    "dbt-duckdb==1.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.8.4",
]
orchestration = [
    "dagster==1.9.5",
    "dagster-webserver==1.9.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nfr --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["nfr"]
# The CLI entry-point scripts run against the real geopackages and are exercised
# end to end by the dbt build on the sample fixture in CI, not by pytest. They
# are excluded from the unit-coverage figure so it reflects the library code the
# unit tests actually cover (keys, fixture subsetting, the path guard), rather
# than reporting a misleading number for integration-tested scripts.
omit = [
    "src/nfr/build_authority_layer.py",
    "src/nfr/diff_versions.py",
    "src/nfr/match_v2_v3_spatial.py",
    "src/nfr/load_sources.py",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
