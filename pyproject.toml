[project]
name = "nigeria-facility-register"
version = "0.1.0"
description = "Version-aware health-facility register for Nigeria, built from GRID3 releases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Muhammad Abiodun Sulaiman" },
    { name = "Bolaji Oyeyemi" },
    { name = "Hammed Sarafadeen" },
]
dependencies = [
    "duckdb==1.1.3",
    "geopandas==1.1.2",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "pyyaml==6.0.2",
    "dbt-duckdb==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
