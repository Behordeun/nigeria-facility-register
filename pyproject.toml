[project]
name = "nigeria-facility-register"
version = "0.11.0"
description = "Version-aware health-facility register for Nigeria, built from GRID3 releases"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Muhammad Abiodun Sulaiman" },
    { name = "Bolaji Fatai  Oyeyemi" },
    { name = "Hammed Sarafadeen" },
]
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.1.2",
    "pandas==3.1.1",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "dbt-duckdb==1.11.1",
    # dbt-core floor is a security floor: 1.12 is the first line whose
    # constraints admit the patched sqlparse (0.6) and, through dbt-common, the
    # patched deepdiff (8). 1.12 also requires protobuf 6, which is why the
    # dagster bump below travels with it. Capped below 1.13: dbt-duckdb 1.11.1
    # targets the 1.12 adapter generation, so the cap keeps 1.12.x patch
    # upgrades available while blocking a jump to a dbt-core minor the pinned
    # adapter was not built against.
    "dbt-core>=1.12.0,<1.13",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.8.4",
    # Topology-aware polygon simplification for scripts/build_lga_geometry.py (a
    # one-off build tool, not a runtime dependency).
    "topojson==2.2",
    # Raster reading and zonal statistics for scripts/build_access_population.py
    # (a one-off build tool, not a runtime dependency). 1.4.x because 1.5 needs
    # Python 3.12 and the project still supports 3.11; wheels bundle GDAL.
    "rasterio==1.4.4",
]
orchestration = [
    # dagster-dbt models each dbt model as its own asset. 0.29.22 (with dagster
    # 1.13.22, which it pins exactly) is the first release whose dbt-core range
    # admits the 1.12 security floor above; earlier 0.29.x cap dbt-core below 1.12.
    "dagster==1.13.22",
    "dagster-webserver==1.13.22",
    "dagster-dbt==0.29.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nfr --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["nfr"]
# I/O orchestration exercised end to end (the dbt build, or a Dagster run), not
# by unit tests: the loader and the Dagster wiring (assets, checks, jobs,
# schedules, sensors, definitions). Their pure helpers (config, gates, inputs,
# snapshot, publish) are tested directly and stay measured.
omit = [
    "src/nfr/load_sources.py",
    "src/nfr/orchestration/assets.py",
    "src/nfr/orchestration/checks.py",
    "src/nfr/orchestration/definitions.py",
    "src/nfr/orchestration/jobs.py",
    "src/nfr/orchestration/schedules.py",
    "src/nfr/orchestration/sensors.py",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
