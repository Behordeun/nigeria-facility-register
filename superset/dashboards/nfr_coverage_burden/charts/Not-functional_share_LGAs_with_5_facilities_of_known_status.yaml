slice_name: Not-functional share (LGAs with 5+ facilities of known status)
description: Percent of facilities recorded as Not-Functional or Closed, among those
  with a recorded status. GRID3 records status only in v3.0 states; LGAs with fewer
  than five facilities of known status are left blank so a tiny sample is not shown
  as a rate.
