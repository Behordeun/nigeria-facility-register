slice_name: Secondary and tertiary facilities
description: Every secondary and tertiary facility with coordinates, coloured by level.
  Primary facilities are summarised in the per-capita maps.
certified_by: null
certification_details: null
viz_type: deck_scatter
params:
  datasource: 6__table
  viz_type: deck_scatter
  extra_form_data: {}
  spatial:
    latCol: latitude
    lonCol: longitude
    type: latlong
  row_limit: 70000
  size: count
  adhoc_filters:
  - expressionType: SQL
    clause: WHERE
    sqlExpression: latitude IS NOT NULL AND longitude IS NOT NULL
    filterOptionName: filter_has_coordinates
  - expressionType: SQL
    clause: WHERE
    sqlExpression: facility_level IN ('Secondary', 'Tertiary')
    filterOptionName: filter_higher_level
  mapbox_style: mapbox://styles/mapbox/light-v9
  viewport:
    longitude: 8.4
    latitude: 9.1
    zoom: 4.5
    bearing: 0
    pitch: 0
    width: 800
    height: 600
    altitude: 1.5
    maxZoom: 20
    minZoom: 0
    maxPitch: 60
    minPitch: 0
    maxLatitude: 85.05113
    minLatitude: -85.05113
  autozoom: true
  point_radius_fixed:
    type: fix
    value: '2500'
  point_unit: square_m
  min_radius: 1
  max_radius: 250
  multiplier: 1
  dimension: level
  color_scheme: supersetColors
  color_picker:
    r: 0
    g: 122
    b: 135
    a: 1
  js_columns: []
  js_data_mutator: ''
  js_tooltip: ''
  js_onclick_href: ''
  annotation_layers: []
