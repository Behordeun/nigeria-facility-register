    sqlExpression: SUM(facilities) * 10000.0 / SUM(population)
    label: Facilities per 10,000 people
    hasCustomLabel: true
    optionName: metric_ca09e5c7b9b3
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT state || '|' || canonical_lga)
    label: LGAs
    hasCustomLabel: true
    optionName: metric_4caf3e7bbbe8
  - expressionType: SQL
    sqlExpression: COUNT(*) FILTER (WHERE facility_status = 'unmatched')
    label: Unmatched LGAs
    hasCustomLabel: true
    optionName: metric_852b53d7b243
  - expressionType: SQL
    sqlExpression: COUNT(*) FILTER (WHERE priority_high_burden_thin_coverage)
    label: Priority LGAs
    hasCustomLabel: true
    optionName: metric_a348917e8a52
  - expressionType: SQL
    sqlExpression: COUNT(*) FILTER (WHERE priority_tier = 'high')
    label: High-priority LGAs
    hasCustomLabel: true
    optionName: metric_priority_high
