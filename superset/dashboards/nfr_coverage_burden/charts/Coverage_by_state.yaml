slice_name: Coverage by state
description: null
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 1__table
  viz_type: table
  extra_form_data: {}
  query_mode: aggregate
  groupby:
  - state
  - facility_source_version
  metrics:
  - expressionType: SQL
    sqlExpression: SUM(facilities)
    label: Facilities
    hasCustomLabel: true
    optionName: metric_b92ac0b9b39e
  - expressionType: SQL
    sqlExpression: SUM(population)
    label: Population
    hasCustomLabel: true
    optionName: metric_e638ffdcb177
