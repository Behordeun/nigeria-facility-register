columns:
- column_name: name
  verbose_name: LGA summary
  is_dttm: false
  is_active: true
  type: VARCHAR
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: "canonical_lga || ', ' || state || ' \xB7 ' || format('{:,}', facilities)\
    \ || CASE WHEN facilities = 1 THEN ' facility' ELSE ' facilities' END || ' ('\
    \ || CASE WHEN facility_source_version IS NULL THEN 'no facility matched' ELSE\
    \ 'GRID3 ' || facility_source_version || ', ' || facility_status END || ')' ||\
    \ ' \xB7 ' || CASE WHEN facilities_per_10k_population IS NULL THEN 'per-capita\
    \ rate n/a' ELSE printf('%.1f', facilities_per_10k_population) || ' per 10k people'\
    \ END || ' \xB7 ' || 'STH ' || coalesce(cast(sth_endemicity_rank_lga as varchar),\
    \ 'unknown') || ' \xB7 ' || 'SCH ' || coalesce(cast(sch_endemicity_rank_lga as\
    \ varchar), 'unknown') || ' \xB7 ' || 'LF ' || coalesce(cast(lf_endemicity_rank_lga\
    \ as varchar), 'unknown') || ' \xB7 ' || 'Oncho ' || coalesce(cast(oncho_endemicity_rank_lga\
    \ as varchar), 'unknown') || ' \xB7 ' || 'Loa ' || coalesce(cast(loa_endemicity_rank_lga\
    \ as varchar), 'unknown') || ' \xB7 ' || CASE WHEN walking_minutes IS NULL THEN\
    \ 'travel time n/a' ELSE printf('%.0f', walking_minutes) || ' min walk, ' || printf('%.0f',\
    \ walking_over_60min_share * 100) || '% over an hour' END || ' \xB7 flood 2024:\
    \ ' || CASE WHEN flood_affected_2024 THEN 'yes' ELSE 'no' END || ' \xB7 access\
    \ risk ' || coalesce(cast(access_risk_score as varchar), 'n/a') || ' \xB7 priority\
    \ score ' || CASE WHEN priority_score IS NULL THEN 'n/a' ELSE priority_score ||\
    \ ' of 8 (burden ' || priority_burden_points || ' + coverage ' || priority_coverage_points\
    \ || ' + access ' || access_risk_score || '), ' || priority_tier END || ' \xB7\
    \ original flag: ' || CASE WHEN priority_high_burden_thin_coverage THEN 'yes'\
    \ ELSE 'no' END"
  description: 'Hover text for the maps: LGA, state, facilities, register version,
    per-capita rate, the five endemicity ranks, travel time, the 2024 flood flag,
    access risk, the priority score with its parts and tier, and the original priority
    flag.'
  python_date_format: null
  extra: null
