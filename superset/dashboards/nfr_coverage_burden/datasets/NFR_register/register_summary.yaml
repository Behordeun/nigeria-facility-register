columns:
- column_name: status_html
  verbose_name: Register status
  is_dttm: false
  is_active: true
  type: VARCHAR
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: '''<p><b>Built '' || strftime(built_at, ''%-d %B %Y, %H:%M'') || ''</b>
    (build host time). Every figure here is read from the published register and refreshes
    with it.</p>'' || ''<h4>Facility registers</h4>'' || ''<p><b>'' || states_on_v3
    || ''</b> of '' || states || '' states use GRID3 v3.0 (released '' || coalesce(strftime(v3_source_date,
    ''%-d %B %Y''), ''not in use'') || ''); <b>'' || states_on_v2 || ''</b> still
    use v2.0 (released '' || coalesce(strftime(v2_source_date, ''%-d %B %Y''), ''not
    in use'') || '') until v3.0 reaches them.'' || CASE WHEN states_without_facilities
    > 0 THEN '' <b>'' || states_without_facilities || ''</b> matched no facility at
    all.'' ELSE '''' END || ''</p>'' || ''<p>The authority layer holds <b>'' || format(''{:,}'',
    facilities) || ''</b> facilities ('' || format(''{:,}'', facilities_v3) || ''
    from v3.0, '' || format(''{:,}'', facilities_v2) || '' from v2.0), of which ''
    || format(''{:,}'', facilities_in_lgas) || '' sit in an LGA the 774-LGA frame
    recognises; the rest carry an LGA label still to reconcile. <b>'' || lgas_unmatched
    || ''</b> of '' || lgas || '' LGAs matched no facility, and <b>'' || priority_lgas
    || ''</b> carry the priority flag.</p>'' || ''<h4>NTD endemicity (ESPEN, latest
    year '' || coalesce(cast(espen_latest_year as varchar), ''unknown'') || '')</h4>''
    || ''<table><tr><th>Disease</th><th>LGAs with a known status</th></tr>'' || ''<tr><td>Soil-transmitted
    helminths</td><td>'' || sth_known_lgas || '' of '' || lgas || ''</td></tr>'' ||
    ''<tr><td>Schistosomiasis</td><td>'' || sch_known_lgas || '' of '' || lgas ||
    ''</td></tr>'' || ''<tr><td>Lymphatic filariasis</td><td>'' || lf_known_lgas ||
    '' of '' || lgas || ''</td></tr>'' || ''<tr><td>Onchocerciasis</td><td>'' || oncho_known_lgas
    || '' of '' || lgas || ''</td></tr>'' || ''<tr><td>Loa loa</td><td>'' || loa_known_lgas
    || '' of '' || lgas || ''</td></tr>'' || ''</table><p>The remaining LGAs have
    no known status and are shown as unknown, never as 0.</p>'' || ''<h4>Changes between
    register versions</h4>'' || ''<p>Matching v2.0 to v3.0 facilities within 100 m:
    <b>'' || format(''{:,}'', lineage_carried_over) || ''</b> carried over, <b>''
    || format(''{:,}'', lineage_dropped) || ''</b> dropped and <b>'' || format(''{:,}'',
    lineage_appeared) || ''</b> appeared. Dropped and appeared records are candidates
    to review, not confirmed closures or openings.</p>'''
  description: null
  python_date_format: null
