    parents:
    - ROOT_ID
    - TABS-main
    - TAB-mix
    - ROW-mix-0
    children: []
    meta:
      width: 12
      height: 24
      code: '### Facility mix


        Facility counts treat a health post and a general hospital alike. This tab
        separates them by GRID3 level (primary, secondary, tertiary) and shows how
        much of the network is recorded as working.


        Two limits come from the source, not the pipeline. About one facility in eight
        has no recorded level; it is counted as Not recorded and never assigned one.
        GRID3 records functional status only in v3.0, and even there most facilities
        are Unknown, so the not-functional share is taken over facilities whose status
        is known, and the map shades only LGAs with at least five of them. Blank means
        not recorded, never fully functional.'
