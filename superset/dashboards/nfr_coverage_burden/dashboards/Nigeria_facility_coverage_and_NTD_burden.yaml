    children: []
    meta:
      width: 12
      height: 60
      code: '## About this dashboard


        **Sources.** GRID3 Nigeria health facilities v2.0 and v3.0 (CC BY 4.0); the
        774-LGA frame and geoBoundaries ADM2 polygons (CC BY 4.0); ESPEN NTD endemicity
        (CC BY-NC-SA 3.0 IGO, non-commercial). See `data/ATTRIBUTION.md`.


        **Missing is not zero.** A stale state, an unknown endemicity status and an
        LGA with no matched facility are each an absence, shown as blank, `unknown`
        or `unmatched`, never as 0.


        **Map rows are polygon parts.** `lga_coverage_choropleth` has one row per
        boundary part (800 over 774 LGAs). Aggregate from `lga_coverage_burden`, never
        by summing map rows.


        **Contract.** Column meanings and guarantees are in `docs/DATA_CONTRACT.md`.'
