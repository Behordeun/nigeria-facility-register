  MARKDOWN-access_note:
    id: MARKDOWN-access_note
    type: MARKDOWN
    parents:
    - ROOT_ID
    - TABS-main
    - TAB-access
    - ROW-access-0
    children: []
    meta:
      width: 12
      height: 36
      code: '### Access and flood exposure


        Travel time is the population-weighted time to the nearest health facility
        from the Malaria Atlas Project (2020 release), set against WorldPop residents in the population year the Data status page names.
        An LGA is hard to reach when a quarter or more of its residents live over
        an hour''s walk from a facility. Flood exposure is the NASA MODIS 2024 event
        at LGA level; the 2022 event is only state-level, so it is in the data but
        not in the score.


        The access risk score counts these two LGA-level signals, 0 to 2. Blank means
        not measured, never low risk.


        Colour key, score map: palest is 0 (legend band 0 - 1), mid red 1, dark red
        2. The table lists every LGA scoring 1 or 2, hardest to reach on foot first.'
