      code: '### Facility coverage

        Counts come from the version-aware authority layer: GRID3 v3.0 where it covers
        a state, v2.0 elsewhere. An LGA with no facility matched is a name-join miss
        to reconcile, never a measured zero. The priority flag marks LGAs with a high
        state-level STH share and thin coverage (bottom tercile of non-zero counts).'
