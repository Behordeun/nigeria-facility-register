    meta:
      width: 12
      height: 22
      code: '### NTD endemicity by LGA

        Per-LGA ESPEN status for five diseases, ranked 0 (non-endemic) to 3 (highest
        need). STH, schistosomiasis and Loa loa rank by prevalence band; lymphatic
        filariasis and onchocerciasis rank by programme stage. An LGA never reported
        with a known status is blank on the map and `unknown` in the chart: unknown
        is not zero.


        Colour key, maps and chart alike: pale yellow 0 (non-endemic), orange 1, red
        2, dark red 3; grey in the chart is unknown.


        ESPEN data: CC BY-NC-SA 3.0 IGO, non-commercial use only.'
