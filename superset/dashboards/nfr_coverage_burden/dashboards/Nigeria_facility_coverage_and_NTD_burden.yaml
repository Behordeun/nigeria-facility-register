    children: []
    meta:
      width: 12
      height: 50
      code: '### Sources and licences


        - **Health facilities**: GRID3 Nigeria health facilities v2.0 and v3.0, CC
        BY 4.0.

        - **LGA boundaries**: geoBoundaries Nigeria ADM2, CC BY 4.0, simplified for
        mapping.

        - **LGA frame**: the 774-LGA master index and name crosswalk derived for this
        register, CC BY 4.0.

        - **NTD endemicity**: ESPEN (WHO Expanded Special Project for Elimination
        of NTDs), CC BY-NC-SA 3.0 IGO. **Non-commercial use only**; only derived per-LGA
        summaries are shown.


        **Missing is not zero.** A state still on v2.0, an unknown endemicity status
        and an LGA with no matched facility are each shown as an absence (`v2.0`,
        blank or `unknown`, `unmatched`), never as a measured 0. Map rows are boundary
        polygon parts (800 over 774 LGAs), so aggregate by LGA, never by summing map
        rows.


        Full attribution: [ATTRIBUTION.md](https://github.com/Behordeun/nigeria-facility-register/blob/development/data/ATTRIBUTION.md).
        Column meanings and guarantees: [DATA_CONTRACT.md](https://github.com/Behordeun/nigeria-facility-register/blob/development/docs/DATA_CONTRACT.md).
        Pipeline: [ARCHITECTURE.md](https://github.com/Behordeun/nigeria-facility-register/blob/development/docs/ARCHITECTURE.md).'
