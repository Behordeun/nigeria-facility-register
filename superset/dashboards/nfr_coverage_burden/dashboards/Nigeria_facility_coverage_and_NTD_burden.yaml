    - TABS-main
    - TAB-overview
    - ROW-overview-priority
    children: []
    meta:
      width: 8
      height: 90
      code: '### Priority score


        Each LGA scores 0-8, higher is more urgent:


        - **Burden, 0-3:** the highest ESPEN endemicity rank across the five diseases.

        - **Coverage, 0-3:** facilities per 10,000 people, by national quartile (lowest
        quarter 3, highest 0).

        - **Access, 0-2:** the access risk score (hard to reach on foot, flood-affected
        in 2024).


        Tiers: **high** 6-8, **medium** 4-5, **low** 0-3. A part that is not measured
        leaves the score blank, never low. Hover any map for an LGA''s breakdown.


        The map beside this note is the original flag (high state-level STH share
        and a thin raw facility count), kept unchanged for comparison while the score
        is reviewed.'
