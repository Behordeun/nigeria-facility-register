    meta:
      width: 12
      height: 18
      code: '### Facility coverage

        Counts come from the version-aware authority layer: GRID3 v3.0 where it covers
        a state, v2.0 elsewhere. An LGA with no facility matched is a name-join miss
        to reconcile, never a measured zero. The priority score (0-8) adds burden,
        per-capita coverage and access points; high is 6-8. The original flag stays
        alongside it for comparison.'
