sonar.projectKey=Behordeun_nigeria-facility-register
sonar.organization=behordeun

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Coverage report produced by pytest-cov (see pyproject [tool.pytest.ini_options]).
sonar.python.coverage.reportPaths=coverage.xml

# The CLI entry-point scripts run against the real geopackages and are exercised
# end to end by the dbt build on the sample fixture in CI, not by unit tests.
# Exclude them from the coverage requirement so the figure reflects the library
# code the unit tests cover, matching the omit list in pyproject.toml.
sonar.coverage.exclusions=\
  src/nfr/build_authority_layer.py,\
  src/nfr/diff_versions.py,\
  src/nfr/match_v2_v3_spatial.py,\
  src/nfr/load_sources.py,\
  scripts/**

# dbt SQL and generated artifacts are not application source.
sonar.exclusions=dbt/target/**,build/**,data/**
