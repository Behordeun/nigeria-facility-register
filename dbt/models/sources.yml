version: 2

sources:
  - name: raw
    schema: main
    description: >
      Source inputs loaded into DuckDB as-is, one table per source vintage.
      Loaded by nfr.load_sources: each table is dropped and recreated wholesale,
      never edited in place, so a reload is idempotent. The authoritative copies
      live upstream (HDX, ESPEN); these tables are just the local read surface.
    tables:
      - name: grid3_v2
        description: GRID3 NGA Health Facilities v2.0 (national, to Oct 2024). CC BY 4.0.
      - name: grid3_v3
        description: GRID3 NGA Health Facilities v3.0 (24 states, to Dec 2025). CC BY 4.0.
      - name: frame_master_index
        description: 774-LGA master index (canonical LGA, state, ESPEN IU id). geoBoundaries CC BY.
      - name: lga_alias_crosswalk
        description: >
          Maps facility-source LGA spellings and former names to the canonical
          774-LGA frame name, so a known variant joins instead of showing a
          false zero. Each row records the match type and a note.
      - name: ntd_sth_state
        description: >
          ESPEN soil-transmitted-helminths endemicity, summarised per state
          (derived). Upstream ESPEN is CC BY-NC-SA 3.0 IGO: derived summary only,
          non-commercial.
      - name: ntd_espen_lga
        description: >
          ESPEN NTD endemicity per LGA for five diseases (STH, schistosomiasis,
          lymphatic filariasis, onchocerciasis, Loa loa), one row per (LGA,
          disease), derived by scripts/build_enrichment_sources.py from the ESPEN
          IU long table (one IU per LGA). Carries the latest year's label as
          published and the latest label that is not an "Unknown ..." status;
          a disease never reported with a known status has a null
          endemicity_latest_known, never a low rank. Upstream ESPEN is
          CC BY-NC-SA 3.0 IGO: derived summary only, non-commercial. Ranked
          and pivoted into lga_coverage_burden through stg_ntd_endemicity_lga.
        columns:
          - name: state
            data_tests: [not_null]
          - name: canonical_lga
            data_tests: [not_null]
          - name: espen_iu_id
            data_tests: [not_null]
          - name: disease
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Soil-transmitted helminths', 'Schistosomiasis', 'Lymphatic filariasis', 'Onchocerciasis', 'Loa loa']
          - name: endemicity_latest
            data_tests: [not_null]
          - name: year_latest
            data_tests: [not_null]
      - name: flood_event_affected_lga
        description: >
          Flood-event exposure per LGA, one row per (LGA, event_year), derived
          from the flood_health event table. The 2022 event is state-resolution
          (the state's flag repeated to each LGA) and the 2024 event
          LGA-resolution, as the resolution column says. affected is a 0/1
          exposure flag, not a severity. Source NASA MODIS flood products (open).
          Pivoted into lga_coverage_burden as flood_affected_2022_state and
          flood_affected_2024.
        columns:
          - name: state
            data_tests: [not_null]
          - name: canonical_lga
            data_tests: [not_null]
          - name: event_year
            data_tests: [not_null]
          - name: affected
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [0, 1]
                    quote: false
          - name: resolution
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['LGA', 'state']
      - name: births_lga
        description: >
          WorldPop annual births per LGA (2015, UN-adjusted, zonal-summed into
          the 774 geoBoundaries polygons), keyed on shapeID. CC BY 4.0. Feeds
          lga_coverage_burden's births and facilities_per_10k_births.
        columns:
          - name: shapeID
            data_tests: [not_null, unique]
          - name: births
            data_tests: [not_null]
      - name: access_population_lga
        description: >
          Per-LGA population (WorldPop R2025A constrained counts, CC BY 4.0) and
          population-weighted travel time to the nearest health facility
          (Malaria Atlas Project 2020 release, motorised and walking-only, CC BY),
          derived by scripts/build_access_population.py and keyed on shapeID.
          Null travel figures mean no population on valid travel-time cells,
          never 0 minutes. Its population feeds lga_coverage_burden's
          population and facilities_per_10k_population, and its travel figures
          its access columns and access_risk_score.
        columns:
          - name: shapeID
            data_tests: [not_null, unique]
          - name: population_year
            data_tests: [not_null]
          - name: population
            data_tests: [not_null]
