version: 2

models:
  - name: lga_coverage_burden
    description: >
      Per-LGA facility coverage crossed with NTD burden. One row per LGA, all
      774 present. See docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the 774-LGA frame. Not unique on its own:
          several LGA names recur across states (Obi in Benue and Nasarawa,
          Surulere in Oyo and Lagos). The key is (state, canonical_lga).
        constraints:
          - type: not_null
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: lga_label
        data_type: varchar
        description: "'<canonical_lga>, <state>': a unique, readable key for selecting one LGA (six LGA names recur across states)."
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id where the frame carries one; null otherwise.
      - name: facilities
        data_type: bigint
        description: >
          Count in the authority layer. 0 means none matched, which may be a
          name-join miss; read with facility_status = 'unmatched' to tell a miss
          from a real low count. Never asserted as a true absence.
        constraints:
          - type: not_null
      - name: facility_source_version
        data_type: varchar
        description: v2.0 or v3.0; null only when the LGA matched no facility.
        data_tests:
          - accepted_values:
              arguments:
                values: ['v2.0', 'v3.0']
              config:
                where: "facility_source_version is not null"
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['current', 'stale-awaiting-v3', 'unmatched']
      - name: facilities_primary
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities in the LGA whose GRID3 level is Primary.
      - name: facilities_secondary
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities whose level is Secondary.
      - name: facilities_tertiary
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities whose level is Tertiary.
      - name: facilities_level_unknown
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities whose level is blank, "Unknown" or missing; counted, never assigned a level.
      - name: facilities_functional
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities recorded as Functional or Partially Functional (GRID3 v3.0 only).
      - name: facilities_not_functional
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities recorded as Not-Functional or Closed (GRID3 v3.0 only).
      - name: facilities_status_unknown
        data_type: bigint
        constraints:
          - type: not_null
        description: Facilities with no recorded functional status, including every facility in a v2.0 state.
      - name: sth_high_share_pct_state
        data_type: double
        description: State-level ESPEN STH high-prevalence share, broadcast to each LGA in the state.
      - name: sth_survey_years_state
        data_type: varchar
      - name: sth_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN soil-transmitted helminths endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "sth_endemicity_rank_lga is not null"
      - name: sch_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN schistosomiasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "sch_endemicity_rank_lga is not null"
      - name: lf_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN lymphatic filariasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "lf_endemicity_rank_lga is not null"
      - name: oncho_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN onchocerciasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "oncho_endemicity_rank_lga is not null"
      - name: loa_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN Loa loa endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "loa_endemicity_rank_lga is not null"
      - name: population
        data_type: bigint
        description: WorldPop R2025A population of the LGA for population_year, summed at 100 m; always positive.
        constraints:
          - type: not_null
      - name: population_year
        data_type: bigint
        description: The year population and the travel figures describe, chosen by stg_access_population_lga (the build's calendar year capped to the years available, or the population_year var).
        constraints:
          - type: not_null
      - name: births
        data_type: double
        description: WorldPop annual births in the LGA for 2015 (UN-adjusted); always positive. Older than the population figure; read the per-births rate as indicative.
        constraints:
          - type: not_null
      - name: facilities_per_10k_population
        data_type: double
        description: >
          facilities x 10,000 / population. Null where facility_status is
          'unmatched' (a zero count there may be a name-join miss), never 0 for
          that reason.
      - name: facilities_per_10k_births
        data_type: double
        description: facilities x 10,000 / births (2015). Null where facility_status is 'unmatched'.
      - name: secondary_tertiary_per_100k_population
        data_type: double
        description: (facilities_secondary + facilities_tertiary) x 100,000 / population. Null where facility_status is 'unmatched'.
      - name: functional_status_known_share
        data_type: double
        description: Share of the LGA's facilities with a recorded functional status (0-1); 0 throughout v2.0 states, null where no facility matched.
      - name: not_functional_share
        data_type: double
        description: facilities_not_functional over the facilities with a recorded status (0-1). Null where no status is recorded, never 0.
      - name: motorised_minutes
        data_type: double
        description: Population-weighted mean travel time to the nearest health facility by motorised transport, in minutes (Malaria Atlas Project, 2020 release). Null where no population sits on valid travel-time cells, never 0.
      - name: walking_minutes
        data_type: double
        description: As motorised_minutes, walking only.
      - name: walking_over_60min_share
        data_type: double
        description: Share of the LGA's population more than 60 minutes' walk from the nearest facility (0-1). Null as for walking_minutes.
      - name: access_population_share
        data_type: double
        description: Share of the LGA's population on valid travel-time cells, i.e. the share the travel figures describe (0-1).
      - name: flood_affected_2022_state
        data_type: boolean
        description: >
          True where the LGA's state was flood-affected in the 2022 event (NASA
          MODIS). State-level: the state's flag repeated to each of its LGAs, so
          it does not say the LGA itself flooded. An exposure flag, not a severity.
        constraints:
          - type: not_null
      - name: flood_affected_2024
        data_type: boolean
        description: True where the LGA was flood-affected in the 2024 event (NASA MODIS, LGA-level). An exposure flag, not a severity.
        constraints:
          - type: not_null
      - name: hard_to_reach
        data_type: boolean
        description: True where at least a quarter of residents (walking_over_60min_share >= 0.25) live more than an hour's walk from the nearest facility. Null where walking_over_60min_share is null.
      - name: priority_high_burden_thin_coverage
        data_type: boolean
        description: >
          Derived flag; true where STH burden is high and facility coverage is
          thin (bottom tercile of non-zero counts). Never true for a
          zero-facility LGA, since 0 may be a name-join miss, not a real absence.
          See docs/DATA_CONTRACT.md.
        constraints:
          - type: not_null
      - name: access_risk_score
        data_type: integer
        description: >
          0-2 access risk from LGA-level signals: one point for hard_to_reach,
          one for flood_affected_2024. Null where hard_to_reach is null, so an
          unmeasured LGA is never scored as low risk. The state-level 2022 flood
          flag is not counted.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
              config:
                where: "access_risk_score is not null"
      - name: ntd_diseases_known
        data_type: integer
        description: How many of the five diseases have a known ESPEN status in the LGA (0-5).
        constraints:
          - type: not_null
      - name: priority_burden_points
        data_type: integer
        description: 0-3, the highest known endemicity rank across the five diseases. Null only when no status is known.
      - name: priority_coverage_points
        data_type: integer
        description: >
          0-3 from national quartiles of facilities_per_10k_population over the
          matched LGAs: 3 in the lowest quartile, 0 in the highest; a value on a
          boundary takes the less urgent band. Null where the rate is null.
      - name: priority_score
        data_type: integer
        description: >
          0-8: priority_burden_points + priority_coverage_points +
          access_risk_score. Null when any part is null, never scored low for
          lack of data. Higher is more urgent.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6, 7, 8]
                quote: false
              config:
                where: "priority_score is not null"
      - name: priority_tier
        data_type: varchar
        description: high (score 6-8), medium (4-5) or low (0-3); null where priority_score is null.
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
              config:
                where: "priority_tier is not null"
      - name: priority_reasons
        data_type: varchar
        description: >
          Why the LGA scores what it does, one clause per part, e.g. "burden 3
          (highest of 3 known disease ranks) · coverage 3 (0.6 facilities per
          10,000 people) · access 1 (flooded in 2024)". Null exactly where
          priority_score is null.
      - name: lga_summary
        data_type: varchar
        description: >
          A one-line summary of the LGA (facilities and register version,
          per-capita rate, the five endemicity ranks, travel time, flood flag,
          access risk, facility mix, priority score and original flag), with
          missing values written out. Used as the map hover.
        constraints:
          - type: not_null

  - name: lga_profile_facts
    description: >
      Everything the register holds for one LGA as readable text: one row per
      LGA and fact, 18 facts for each of the 774 LGAs, in display order. Values
      are text with missing inputs written out ("n/a", "unknown", "not
      measured"), never 0. See docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: lga_label
        data_type: varchar
        description: As in lga_coverage_burden.
        constraints:
          - type: not_null
      - name: fact_order
        data_type: integer
        description: Display order within the LGA, 1-18.
        constraints:
          - type: not_null
      - name: section
        data_type: varchar
        description: The group the fact belongs to (LGA, Priority, Facilities, People and access, NTD endemicity rank (0-3)).
        constraints:
          - type: not_null
      - name: fact
        data_type: varchar
        description: What the value describes.
        constraints:
          - type: not_null
      - name: value
        data_type: varchar
        description: The fact's value as text.
        constraints:
          - type: not_null

  - name: lga_coverage_outlook
    description: >
      Per-LGA coverage for every WorldPop population year the register carries
      (2025-2030), holding today's facility count fixed: one row per (LGA,
      population_year). The register-year row matches lga_coverage_burden. See
      docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: lga_label
        data_type: varchar
        description: As in lga_coverage_burden.
      - name: canonical_lga
        data_type: varchar
        constraints:
          - type: not_null
      - name: population_year
        data_type: bigint
        constraints:
          - type: not_null
      - name: is_register_year
        data_type: boolean
        description: True on the rows for the population year the published register describes.
        constraints:
          - type: not_null
      - name: is_last_projection_year
        data_type: boolean
        description: True on the rows for the last WorldPop year the register carries (2030 today).
        constraints:
          - type: not_null
      - name: population
        data_type: bigint
        description: WorldPop R2025A population of the LGA for population_year.
        constraints:
          - type: not_null
      - name: facilities
        data_type: bigint
        description: Today's facility count for the LGA (from lga_coverage_burden), held fixed across years.
        constraints:
          - type: not_null
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
      - name: facilities_per_10k_population
        data_type: double
        description: facilities x 10,000 / population for population_year; null where facility_status is 'unmatched'.
      - name: population_change_from_register_year
        data_type: double
        description: population / the register year's population - 1 (0 on the register-year row).
      - name: facilities_per_10k_change_from_register_year
        data_type: double
        description: facilities_per_10k_population minus the register year's value; null where the rate is null.

  - name: lga_version_drift
    description: >
      The v2.0-to-v3.0 facility lineage made queryable against the canonical
      774-LGA frame. One row per facility-lineage record. See
      docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: facility_id
        data_type: varchar
        description: The facility this record is about (v3 id, or v2 id when dropped). Unique.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: lineage_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['carried-over', 'dropped', 'appeared']
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the frame, resolved via the alias crosswalk.
          Null when the source LGA label does not resolve to a frame LGA: an
          unresolved label, not an absent one. Not unique on its own; the
          natural key is the facility.
      - name: source_lga
        data_type: varchar
        description: >
          The LGA label as it came from the source (v3 side for carried-over and
          appeared, v2 side for dropped), before frame resolution. Kept so a null
          canonical_lga still shows the label that needs reconciliation.
      - name: state
        data_type: varchar
        description: Canonical state; the frame's state where resolved, else the lineage state.
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id from the frame where the LGA resolved and the frame carries one.
      - name: v2_id
        data_type: varchar
        description: globalid of the v2.0 facility; null for an appeared record.
      - name: v3_id
        data_type: varchar
        description: unique_id of the v3.0 facility; null for a dropped record.
      - name: v2_name
        data_type: varchar
      - name: v3_name
        data_type: varchar
      - name: match_distance_m
        data_type: double
        description: Metres between the paired facilities; null unless carried-over.
      - name: name_similarity
        data_type: double
        description: Jaro-Winkler similarity of the two names; null unless carried-over.
      - name: name_match_band
        data_type: varchar
        description: Banded name similarity; null unless carried-over. See stg_version_lineage.
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact-or-near', 'close', 'divergent']
              config:
                where: "name_match_band is not null"

  - name: lga_coverage_choropleth
    description: >
      lga_coverage_burden with each LGA's boundary polygon attached (as GeoJSON
      text) for mapping. One row per LGA, all 774 present, each with geometry.
      See docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: canonical_lga
        data_type: varchar
        constraints:
          - type: not_null
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: lga_label
        data_type: varchar
        description: As in lga_coverage_burden.
      - name: lga_summary
        data_type: varchar
        description: As in lga_coverage_burden; the map hover text.
      - name: espen_iu_id
        data_type: bigint
      - name: facilities
        data_type: bigint
        constraints:
          - type: not_null
      - name: facility_source_version
        data_type: varchar
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
      - name: sth_high_share_pct_state
        data_type: double
      - name: sth_survey_years_state
        data_type: varchar
      - name: priority_high_burden_thin_coverage
        data_type: boolean
        constraints:
          - type: not_null
      - name: sth_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: sch_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: lf_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: oncho_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: loa_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: population
        data_type: bigint
        description: As in lga_coverage_burden.
      - name: facilities_per_10k_population
        data_type: double
        description: As in lga_coverage_burden; null where no facility matched.
      - name: motorised_minutes
        data_type: double
        description: As in lga_coverage_burden.
      - name: walking_minutes
        data_type: double
        description: As in lga_coverage_burden.
      - name: walking_over_60min_share
        data_type: double
        description: As in lga_coverage_burden.
      - name: flood_affected_2024
        data_type: boolean
        description: As in lga_coverage_burden.
      - name: hard_to_reach
        data_type: boolean
        description: As in lga_coverage_burden.
      - name: access_risk_score
        data_type: integer
        description: As in lga_coverage_burden.
      - name: facilities_secondary
        data_type: bigint
        description: As in lga_coverage_burden.
      - name: facilities_tertiary
        data_type: bigint
        description: As in lga_coverage_burden.
      - name: secondary_tertiary_per_100k_population
        data_type: double
        description: As in lga_coverage_burden.
      - name: functional_status_known_share
        data_type: double
        description: As in lga_coverage_burden.
      - name: not_functional_share
        data_type: double
        description: As in lga_coverage_burden.
      - name: ntd_diseases_known
        data_type: integer
        description: As in lga_coverage_burden.
      - name: priority_burden_points
        data_type: integer
        description: As in lga_coverage_burden.
      - name: priority_coverage_points
        data_type: integer
        description: As in lga_coverage_burden.
      - name: priority_score
        data_type: integer
        description: As in lga_coverage_burden.
      - name: priority_tier
        data_type: varchar
        description: As in lga_coverage_burden.
      # The two geometry columns are attached by a LEFT JOIN to the boundaries,
      # so they are nullable at the type level: a not_null contract here would
      # fail enforcement with a blunt error on a join miss. The completeness
      # guarantee (every LGA carries geometry) is instead the singular test
      # assert_choropleth_every_lga_has_geometry, which names the shortfall
      # precisely rather than failing the contract on the first null.
      - name: geometry_geojson
        data_type: varchar
        description: The LGA boundary polygon as a GeoJSON text string (a map layer reads it as a string and parses it; a json type returns a parsed object the layer cannot consume), from the vendored simplified geoBoundaries set.
      - name: geometry_feature
        data_type: varchar
        description: The LGA as a complete GeoJSON Feature string (type, geometry, properties), for the deck.gl Geojson layer, which reads geometry and properties off each row. properties carries canonical_lga, state, facilities, facility_status, sth_high_share_pct_state, priority_high_burden_thin_coverage, the five *_endemicity_rank_lga columns, population, facilities_per_10k_population, the travel-time columns, flood_affected_2024, hard_to_reach, access_risk_score and the priority score with its parts and tier for colouring and tooltips.

  - name: register_summary
    description: >
      One row describing the published register: when it was built, which GRID3
      release each part comes from, how much of the LGA frame each source covers,
      and the lineage totals. Rebuilt on every refresh, so a dashboard can render
      it as a live summary. See docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: built_at
        data_type: timestamp
        description: When this register was built (the refresh that published it), in the build host's clock.
        constraints:
          - type: not_null
      - name: lgas
        data_type: bigint
        description: LGAs in the coverage mart; 774 by contract.
        constraints:
          - type: not_null
      - name: states
        data_type: bigint
        constraints:
          - type: not_null
      - name: states_on_v3
        data_type: bigint
        description: States whose facilities come from GRID3 v3.0.
        constraints:
          - type: not_null
      - name: states_on_v2
        data_type: bigint
        description: States still on GRID3 v2.0, awaiting v3.0 coverage.
        constraints:
          - type: not_null
      - name: states_without_facilities
        data_type: bigint
        description: States none of whose LGAs matched a facility, so no version applies; an absence to reconcile, not a third version.
        constraints:
          - type: not_null
      - name: v3_source_date
        data_type: date
        description: Release date of the GRID3 v3.0 register in use; null if no state uses it.
      - name: v2_source_date
        data_type: date
        description: Release date of the GRID3 v2.0 register in use; null if no state uses it.
      - name: facilities
        data_type: bigint
        description: Facilities in the authority layer (v3.0 plus v2.0).
        constraints:
          - type: not_null
      - name: facilities_in_lgas
        data_type: bigint
        description: Facilities whose LGA resolved to a frame LGA; at most `facilities`.
        constraints:
          - type: not_null
      - name: facilities_v3
        data_type: bigint
        constraints:
          - type: not_null
      - name: facilities_v2
        data_type: bigint
        constraints:
          - type: not_null
      - name: lgas_unmatched
        data_type: bigint
        description: LGAs that matched no facility (a name-join miss to reconcile, not a measured zero).
        constraints:
          - type: not_null
      - name: priority_lgas
        data_type: bigint
        description: LGAs with the original priority flag (priority_high_burden_thin_coverage) set.
        constraints:
          - type: not_null
      - name: priority_high_tier_lgas
        data_type: bigint
