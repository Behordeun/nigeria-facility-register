version: 2

models:
  - name: lga_coverage_burden
    description: >
      Per-LGA facility coverage crossed with NTD burden. One row per LGA, all
      774 present. See docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the 774-LGA frame. Not unique on its own:
          several LGA names recur across states (Obi in Benue and Nasarawa,
          Surulere in Oyo and Lagos). The key is (state, canonical_lga).
        constraints:
          - type: not_null
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id where the frame carries one; null otherwise.
      - name: facilities
        data_type: bigint
        description: >
          Count in the authority layer. 0 means none matched, which may be a
          name-join miss; read with facility_status = 'unmatched' to tell a miss
          from a real low count. Never asserted as a true absence.
        constraints:
          - type: not_null
      - name: facility_source_version
        data_type: varchar
        description: v2.0 or v3.0; null only when the LGA matched no facility.
        data_tests:
          - accepted_values:
              arguments:
                values: ['v2.0', 'v3.0']
              config:
                where: "facility_source_version is not null"
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['current', 'stale-awaiting-v3', 'unmatched']
      - name: sth_high_share_pct_state
        data_type: double
        description: State-level ESPEN STH high-prevalence share, broadcast to each LGA in the state.
      - name: sth_survey_years_state
        data_type: varchar
      - name: priority_high_burden_thin_coverage
        data_type: boolean
        description: >
          Derived flag; true where STH burden is high and facility coverage is
          thin (bottom tercile of non-zero counts). Never true for a
          zero-facility LGA, since 0 may be a name-join miss, not a real absence.
          See docs/DATA_CONTRACT.md.
        constraints:
          - type: not_null

  - name: lga_version_drift
    description: >
      The v2.0-to-v3.0 facility lineage made queryable against the canonical
      774-LGA frame. One row per facility-lineage record. See
      docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: facility_id
        data_type: varchar
        description: The facility this record is about (v3 id, or v2 id when dropped). Unique.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: lineage_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['carried-over', 'dropped', 'appeared']
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the frame, resolved via the alias crosswalk.
          Null when the source LGA label does not resolve to a frame LGA: an
          unresolved label, not an absent one. Not unique on its own; the
          natural key is the facility.
      - name: state
        data_type: varchar
        description: Canonical state; the frame's state where resolved, else the lineage state.
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id from the frame where the LGA resolved and the frame carries one.
      - name: v2_id
        data_type: varchar
        description: globalid of the v2.0 facility; null for an appeared record.
      - name: v3_id
        data_type: varchar
        description: unique_id of the v3.0 facility; null for a dropped record.
      - name: v2_name
        data_type: varchar
      - name: v3_name
        data_type: varchar
      - name: match_distance_m
        data_type: double
        description: Metres between the paired facilities; null unless carried-over.
      - name: name_similarity
        data_type: double
        description: Jaro-Winkler similarity of the two names; null unless carried-over.
      - name: name_match_band
        data_type: varchar
        description: Banded name similarity; null unless carried-over. See stg_version_lineage.
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact-or-near', 'close', 'divergent']
              config:
                where: "name_match_band is not null"
