version: 2

models:
  - name: lga_coverage_burden
    description: >
      Per-LGA facility coverage crossed with NTD burden. One row per LGA, all
      774 present. See docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the 774-LGA frame. Not unique on its own:
          several LGA names recur across states (Obi in Benue and Nasarawa,
          Surulere in Oyo and Lagos). The key is (state, canonical_lga).
        constraints:
          - type: not_null
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id where the frame carries one; null otherwise.
      - name: facilities
        data_type: bigint
        description: >
          Count in the authority layer. 0 means none matched, which may be a
          name-join miss; read with facility_status = 'unmatched' to tell a miss
          from a real low count. Never asserted as a true absence.
        constraints:
          - type: not_null
      - name: facility_source_version
        data_type: varchar
        description: v2.0 or v3.0; null only when the LGA matched no facility.
        data_tests:
          - accepted_values:
              arguments:
                values: ['v2.0', 'v3.0']
              config:
                where: "facility_source_version is not null"
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['current', 'stale-awaiting-v3', 'unmatched']
      - name: sth_high_share_pct_state
        data_type: double
        description: State-level ESPEN STH high-prevalence share, broadcast to each LGA in the state.
      - name: sth_survey_years_state
        data_type: varchar
      - name: sth_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN soil-transmitted helminths endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "sth_endemicity_rank_lga is not null"
      - name: sch_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN schistosomiasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "sch_endemicity_rank_lga is not null"
      - name: lf_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN lymphatic filariasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "lf_endemicity_rank_lga is not null"
      - name: oncho_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN onchocerciasis endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "oncho_endemicity_rank_lga is not null"
      - name: loa_endemicity_rank_lga
        data_type: integer
        description: >
          Per-LGA ESPEN Loa loa endemicity rank, 0-3 (see the
          ntd_endemicity_rank seed); null when the LGA was never reported with
          a known status, never 0. Non-commercial (ESPEN CC BY-NC-SA 3.0 IGO).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                where: "loa_endemicity_rank_lga is not null"
      - name: priority_high_burden_thin_coverage
        data_type: boolean
        description: >
          Derived flag; true where STH burden is high and facility coverage is
          thin (bottom tercile of non-zero counts). Never true for a
          zero-facility LGA, since 0 may be a name-join miss, not a real absence.
          See docs/DATA_CONTRACT.md.
        constraints:
          - type: not_null

  - name: lga_version_drift
    description: >
      The v2.0-to-v3.0 facility lineage made queryable against the canonical
      774-LGA frame. One row per facility-lineage record. See
      docs/DATA_CONTRACT.md for the full contract.
    config:
      contract:
        enforced: true
    columns:
      - name: facility_id
        data_type: varchar
        description: The facility this record is about (v3 id, or v2 id when dropped). Unique.
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: lineage_status
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              arguments:
                values: ['carried-over', 'dropped', 'appeared']
      - name: canonical_lga
        data_type: varchar
        description: >
          Canonical LGA name from the frame, resolved via the alias crosswalk.
          Null when the source LGA label does not resolve to a frame LGA: an
          unresolved label, not an absent one. Not unique on its own; the
          natural key is the facility.
      - name: source_lga
        data_type: varchar
        description: >
          The LGA label as it came from the source (v3 side for carried-over and
          appeared, v2 side for dropped), before frame resolution. Kept so a null
          canonical_lga still shows the label that needs reconciliation.
      - name: state
        data_type: varchar
        description: Canonical state; the frame's state where resolved, else the lineage state.
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
        description: ESPEN IU id from the frame where the LGA resolved and the frame carries one.
      - name: v2_id
        data_type: varchar
        description: globalid of the v2.0 facility; null for an appeared record.
      - name: v3_id
        data_type: varchar
        description: unique_id of the v3.0 facility; null for a dropped record.
      - name: v2_name
        data_type: varchar
      - name: v3_name
        data_type: varchar
      - name: match_distance_m
        data_type: double
        description: Metres between the paired facilities; null unless carried-over.
      - name: name_similarity
        data_type: double
        description: Jaro-Winkler similarity of the two names; null unless carried-over.
      - name: name_match_band
        data_type: varchar
        description: Banded name similarity; null unless carried-over. See stg_version_lineage.
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact-or-near', 'close', 'divergent']
              config:
                where: "name_match_band is not null"

  - name: lga_coverage_choropleth
    description: >
      lga_coverage_burden with each LGA's boundary polygon attached (as GeoJSON
      text) for mapping. One row per LGA, all 774 present, each with geometry.
      See docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: canonical_lga
        data_type: varchar
        constraints:
          - type: not_null
      - name: state
        data_type: varchar
        constraints:
          - type: not_null
      - name: espen_iu_id
        data_type: bigint
      - name: facilities
        data_type: bigint
        constraints:
          - type: not_null
      - name: facility_source_version
        data_type: varchar
      - name: facility_status
        data_type: varchar
        constraints:
          - type: not_null
      - name: sth_high_share_pct_state
        data_type: double
      - name: sth_survey_years_state
        data_type: varchar
      - name: priority_high_burden_thin_coverage
        data_type: boolean
        constraints:
          - type: not_null
      - name: sth_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: sch_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: lf_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: oncho_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      - name: loa_endemicity_rank_lga
        data_type: integer
        description: As in lga_coverage_burden; null when the LGA's status was never known.
      # The two geometry columns are attached by a LEFT JOIN to the boundaries,
      # so they are nullable at the type level: a not_null contract here would
      # fail enforcement with a blunt error on a join miss. The completeness
      # guarantee (every LGA carries geometry) is instead the singular test
      # assert_choropleth_every_lga_has_geometry, which names the shortfall
      # precisely rather than failing the contract on the first null.
      - name: geometry_geojson
        data_type: varchar
        description: The LGA boundary polygon as a GeoJSON text string (a map layer reads it as a string and parses it; a json type returns a parsed object the layer cannot consume), from the vendored simplified geoBoundaries set.
      - name: geometry_feature
        data_type: varchar
        description: The LGA as a complete GeoJSON Feature string (type, geometry, properties), for the deck.gl Geojson layer, which reads geometry and properties off each row. properties carries canonical_lga, state, facilities, facility_status, sth_high_share_pct_state, priority_high_burden_thin_coverage and the five *_endemicity_rank_lga columns for colouring and tooltips.

  - name: register_summary
    description: >
      One row describing the published register: when it was built, which GRID3
      release each part comes from, how much of the LGA frame each source covers,
      and the lineage totals. Rebuilt on every refresh, so a dashboard can render
      it as a live summary. See docs/DATA_CONTRACT.md.
    config:
      contract:
        enforced: true
    columns:
      - name: built_at
        data_type: timestamp
        description: When this register was built (the refresh that published it), in the build host's clock.
        constraints:
          - type: not_null
      - name: lgas
        data_type: bigint
        description: LGAs in the coverage mart; 774 by contract.
        constraints:
          - type: not_null
      - name: states
        data_type: bigint
        constraints:
          - type: not_null
      - name: states_on_v3
        data_type: bigint
        description: States whose facilities come from GRID3 v3.0.
        constraints:
          - type: not_null
      - name: states_on_v2
        data_type: bigint
        description: States still on GRID3 v2.0, awaiting v3.0 coverage.
        constraints:
          - type: not_null
      - name: states_without_facilities
        data_type: bigint
        description: States none of whose LGAs matched a facility, so no version applies; an absence to reconcile, not a third version.
        constraints:
          - type: not_null
      - name: v3_source_date
        data_type: date
        description: Release date of the GRID3 v3.0 register in use; null if no state uses it.
      - name: v2_source_date
        data_type: date
        description: Release date of the GRID3 v2.0 register in use; null if no state uses it.
      - name: facilities
        data_type: bigint
        description: Facilities in the authority layer (v3.0 plus v2.0).
        constraints:
          - type: not_null
      - name: facilities_in_lgas
        data_type: bigint
        description: Facilities whose LGA resolved to a frame LGA; at most `facilities`.
        constraints:
          - type: not_null
      - name: facilities_v3
        data_type: bigint
        constraints:
          - type: not_null
      - name: facilities_v2
        data_type: bigint
        constraints:
          - type: not_null
      - name: lgas_unmatched
        data_type: bigint
        description: LGAs that matched no facility (a name-join miss to reconcile, not a measured zero).
        constraints:
          - type: not_null
      - name: priority_lgas
        data_type: bigint
        constraints:
          - type: not_null
      - name: sth_known_lgas
        data_type: bigint
        description: LGAs with a known ESPEN STH status (a rank); the rest are unknown, not zero.
        constraints:
          - type: not_null
      - name: sch_known_lgas
        data_type: bigint
        constraints:
          - type: not_null
      - name: lf_known_lgas
        data_type: bigint
        constraints:
          - type: not_null
      - name: oncho_known_lgas
        data_type: bigint
        constraints:
          - type: not_null
      - name: loa_known_lgas
        data_type: bigint
        constraints:
          - type: not_null
      - name: espen_latest_year
        data_type: integer
        description: Latest year any ESPEN status is reported for.
      - name: lineage_carried_over
        data_type: bigint
        constraints:
          - type: not_null
      - name: lineage_dropped
        data_type: bigint
        constraints:
          - type: not_null
      - name: lineage_appeared
        data_type: bigint
        constraints:
          - type: not_null
