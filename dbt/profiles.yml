# Local dbt-duckdb profile. The database file is created under build/ and is
# gitignored; the pipeline rebuilds it from the source files on every run.
#
# The path is NFR_DUCKDB_PATH when set, else ../build/scratch.duckdb, never the
# published register (build/nfr.duckdb): a bare `dbt build` cannot overwrite what
# Superset reads. `make build` and `make sample` set the variable to their DB.
# The Dagster refresh sets it to a run-scoped side file, builds and tests there,
# and promotes that file onto the published path only after the whole build and
# the quality gate pass, so a reader never sees a half-built or rejected register.
nfr:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('NFR_DUCKDB_PATH', '../build/scratch.duckdb') }}"
      threads: 4
      # The spatial extension is needed by the choropleth model, which ST_Reads
      # the vendored LGA boundary geojson. dbt-duckdb installs and loads it on
      # connect, so no per-model hook is required.
      extensions:
        - spatial
